<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Lighting Gradients -->
    <linearGradient id="bodySkin" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#E8A982"/>
      <stop offset="35%" stop-color="#C5845E"/>
      <stop offset="70%" stop-color="#965636"/>
      <stop offset="100%" stop-color="#4F2714"/>
    </linearGradient>

    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#DFA316" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8C5C00" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="shortsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A2A2A"/>
      <stop offset="50%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <linearGradient id="ironGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#777777"/>
      <stop offset="50%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g id="athleteGroup" transform="translate(40, 20)">
    <!-- Back & Traps Muscle Structure (Side/Back View) -->
    <!-- Head/Hair -->
    <path d="M 330 110 C 320 90, 350 70, 370 80 C 385 88, 390 105, 375 125 C 365 130, 345 130, 330 110 Z" fill="#1C130D"/>
    <!-- Head highlight -->
    <path d="M 345 82 Q 360 78 375 85 Q 365 95 345 82 Z" fill="#DFA316" opacity="0.4"/>

    <!-- Neck & Trapezius -->
    <path d="M 330 120 C 310 135, 270 155, 240 180 C 270 190, 320 180, 360 160 C 375 145, 360 130, 330 120 Z" fill="url(#bodySkin)"/>
    <path d="M 335 120 Q 290 145 250 175 Q 300 160 355 145 Z" fill="url(#goldHighlight)"/>

    <!-- Left Shoulder/Deltoid (Far) -->
    <path d="M 230 180 C 200 195, 185 230, 200 260 C 220 270, 245 250, 260 220 Z" fill="#753F24"/>

    <!-- Right Shoulder / Rear Deltoid (Near - Sculpted) -->
    <path d="M 360 160 C 400 175, 435 210, 425 255 C 405 285, 370 280, 345 240 C 340 200, 350 175, 360 160 Z" fill="url(#bodySkin)"/>
    <!-- Rim Light on Right Shoulder -->
    <path d="M 370 165 C 410 180, 432 215, 420 255 Q 400 220 370 165 Z" fill="url(#goldHighlight)"/>

    <!-- Right Bicep / Tricep flexed holding dumbbell downwards -->
    <path d="M 400 250 C 440 290, 450 350, 425 410 C 400 420, 375 390, 375 340 C 375 290, 385 260, 400 250 Z" fill="url(#bodySkin)"/>
    <!-- Tricep Horseshoe Highlight -->
    <path d="M 410 270 Q 440 320 420 380 Q 395 330 410 270 Z" fill="url(#goldHighlight)"/>

    <!-- Forearm extending down to hold dumbbell -->
    <path d="M 410 390 C 430 440, 435 500, 420 545 C 395 550, 380 510, 385 450 C 390 410, 400 395, 410 390 Z" fill="url(#bodySkin)"/>
    <path d="M 415 410 Q 430 470 415 540 Q 395 480 415 410 Z" fill="url(#goldHighlight)"/>

    <!-- Hand gripping Dumbbell Handle -->
    <path d="M 405 535 C 415 530, 430 540, 425 560 C 410 570, 395 560, 400 545 Z" fill="#8C4E2D"/>

    <!-- DUMBBELL (Matching reference screenshot) -->
    <!-- Center Steel Bar -->
    <rect x="370" y="542" width="90" height="14" rx="3" fill="url(#ironGrad)"/>
    <!-- Inner Plates Left -->
    <rect x="360" y="515" width="16" height="68" rx="4" fill="#222"/>
    <rect x="350" y="510" width="14" height="78" rx="4" fill="#111"/>
    <!-- Outer Plates Left -->
    <rect x="338" y="505" width="14" height="88" rx="4" fill="#333"/>
    <rect x="338" y="505" width="14" height="88" rx="4" fill="url(#goldHighlight)" opacity="0.3"/>
    <!-- Inner Plates Right -->
    <rect x="454" y="515" width="16" height="68" rx="4" fill="#222"/>
    <rect x="466" y="510" width="14" height="78" rx="4" fill="#111"/>
    <!-- Outer Plates Right -->
    <rect x="478" y="505" width="14" height="88" rx="4" fill="#333"/>
    <rect x="478" y="505" width="14" height="88" rx="4" fill="url(#goldHighlight)" opacity="0.3"/>

    <!-- Main Back Muscle Group (Lats & Rhomboids) -->
    <path d="M 240 180 C 280 200, 340 200, 350 240 C 355 300, 340 370, 310 430 C 270 430, 240 380, 220 310 C 210 250, 220 200, 240 180 Z" fill="url(#bodySkin)"/>
    <!-- Spine & Lat Cut Highlight -->
    <path d="M 310 210 C 330 250, 335 320, 315 410 Q 290 320 270 250 Z" fill="url(#goldHighlight)" opacity="0.65"/>
    <path d="M 280 220 Q 240 280 230 350 Q 275 310 280 220 Z" fill="#66341B"/>

    <!-- Waist & Lower Back Cut -->
    <path d="M 290 420 C 320 430, 335 460, 330 490 C 290 500, 260 480, 260 440 Z" fill="url(#bodySkin)"/>

    <!-- BLACK GYM SHORTS (Matching reference screenshot) -->
    <path d="M 255 460 L 345 465 L 360 620 L 305 635 L 290 550 L 275 630 L 235 615 Z" fill="url(#shortsGrad)"/>
    <!-- Shorts Fold Lines & Elastic Waistband -->
    <path d="M 255 460 Q 300 455 345 465 L 343 480 Q 300 470 257 475 Z" fill="#DFA316" opacity="0.8"/>
    <path d="M 295 480 L 290 550" stroke="#111" stroke-width="3"/>
    <path d="M 315 475 Q 330 540 345 610" stroke="#333" stroke-width="2.5"/>
    <path d="M 270 475 Q 260 540 250 605" stroke="#333" stroke-width="2.5"/>

    <!-- Muscular Thighs / Legs (Under Shorts) -->
    <!-- Left Leg -->
    <path d="M 240 610 C 235 650, 245 700, 260 740 C 275 745, 290 735, 285 690 C 280 650, 275 620, 270 610 Z" fill="url(#bodySkin)"/>
    <!-- Right Leg -->
    <path d="M 310 625 C 315 660, 325 710, 340 750 C 355 755, 370 740, 360 690 C 350 650, 345 625, 340 620 Z" fill="url(#bodySkin)"/>
    <path d="M 320 630 Q 345 690 350 740 Q 335 700 320 630 Z" fill="url(#goldHighlight)" opacity="0.4"/>
  </g>
</svg>
