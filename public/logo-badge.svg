<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C345"/>
      <stop offset="50%" stop-color="#DFA316"/>
      <stop offset="100%" stop-color="#B87E09"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Shield Shadow & Base -->
  <g filter="url(#badgeShadow)">
    <!-- Shield Outline Gold Outer -->
    <path d="M 100,10 L 180,45 C 180,140 140,195 100,225 C 60,195 20,140 20,45 Z" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round"/>
    <!-- Inner Shield Gold Frame -->
    <path d="M 100,20 L 170,50 C 170,135 133,185 100,212 C 67,185 30,135 30,50 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.85"/>
  </g>

  <!-- Crown / Muscle Silhouette at Top -->
  <g fill="url(#goldGrad)" transform="translate(100, 75) scale(0.95)">
    <!-- Muscular Torso/Pose -->
    <!-- Head -->
    <circle cx="0" cy="-35" r="9"/>
    <!-- Neck & Traps -->
    <path d="M -12,-24 Q 0,-30 12,-24 L 20,-16 Q 0,-20 -20,-16 Z"/>
    <!-- Shoulders & Biceps (flexed) -->
    <path d="M -30,-12 Q -38,-25 -22,-30 Q -12,-25 -15,-10 Z"/>
    <path d="M 30,-12 Q 38,-25 22,-30 Q 12,-25 15,-10 Z"/>
    <!-- Dumbbells held in hands -->
    <rect x="-38" y="-32" width="6" height="12" rx="2"/>
    <rect x="32" y="-32" width="6" height="12" rx="2"/>
    <!-- Chest & Abs -->
    <path d="M -20,-12 Q 0,-6 20,-12 Q 18,10 0,22 Q -18,10 -20,-12 Z"/>
    <!-- Ribs/Lats -->
    <path d="M -22,-8 Q -30,5 -14,18 Z"/>
    <path d="M 22,-8 Q 30,5 14,18 Z"/>
  </g>

  <!-- Banner Box -->
  <rect x="24" y="125" width="152" height="42" rx="4" fill="#0A0A0A" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- LEO Text -->
  <text x="100" y="146" text-anchor="middle" font-family="'Oswald', 'Montserrat', sans-serif" font-weight="900" font-size="20" fill="url(#goldGrad)" letter-spacing="3">LEO</text>
  
  <!-- FITNESS PRO Subtext -->
  <text x="100" y="160" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="800" font-size="9.5" fill="#FFFFFF" letter-spacing="2">FITNESS PRO</text>

  <!-- Decorative Stars -->
  <polygon points="40,148 42,153 47,153 43,156 45,161 40,158 35,161 37,156 33,153 38,153" fill="url(#goldGrad)" transform="scale(0.6) translate(30, 95)"/>
  <polygon points="160,148 162,153 167,153 163,156 165,161 160,158 155,161 157,156 153,153 158,153" fill="url(#goldGrad)" transform="scale(0.6) translate(220, 95)"/>
</svg>
